    function run($num,$str,$limit=9999) {
        $buff="";
        $count=0;
        $fp=popen($str,"r");
        $out="-----------------------------------------------------------\n";
        $out.="($num) $str\n";
        $out.="-----------------------------------------------------------\n";
        while ($buff=fgets($fp,5000) ) {
            if ($count==0&&($buff==""||$buff=="\n")) continue;
            if ( $limit<$count++ ) break;
            $out.=$buff;
        }
        pclose($fp);
        return $out;
    }

    $now_date=date("Y-m-d H:i:s");
    $str="";

    $str.="(1) $now_date\n";

    if (!$hide) {
